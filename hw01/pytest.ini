[pytest]
testpaths = tests
addopts = -ra
markers =
    yarn_correction: yarn_find_correction_dim (3 points)
    yarn_ramp: yarn_linear_ramp (3 points)
    yarn_frequencies: yarn_scaled_inv_freq (6 points)
    yarn_forward: YaRNRotaryEmbedding.forward (8 points)
    mla_projection: MultiHeadLatentAttention._project_current (7 points)
    mla_cache: MultiHeadLatentAttention._append_cache (5 points)
    mla_naive: MultiHeadLatentAttention._naive_attention (9 points)
    mla_absorbed: MultiHeadLatentAttention._absorbed_attention (16 points)
    moe_routing: SparseMoE._top_k_routing (7 points)
    moe_capacity: SparseMoE._accepted_assignments (6 points)
    moe_dispatch: SparseMoE._dispatch (10 points)
    moe_aux: Switch auxiliary loss in SparseMoE._routing_statistics (7 points)
