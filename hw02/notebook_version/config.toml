[model]
name = "HuggingFaceTB/SmolLM2-135M"
gradient_checkpointing = false

[data]
name = "Salesforce/wikitext"
subset = "wikitext-103-raw-v1"
text_column = "text"
sequence_length = 256
minimum_length = 64
train_documents = 80000
eval_documents = 512

[train]
seed = 42
micro_batch_size = 4
gradient_accumulation_steps = 16
max_optimizer_steps = 180
eval_every = 15
warmup_steps = 14
max_grad_norm = 1.0
mixed_precision = true
num_workers = 0
meter_warmup_steps = 5

[adamw]
lr = 0.00005
betas = [0.9, 0.95]
weight_decay = 0.1

[muon]
lr = 0.0005
fallback_lr = 0.00005
momentum = 0.95
weight_decay = 0.1
ns_steps = 5
adjust_lr_fn = "match_rms_adamw"

[apollo]
lr = 0.0002
fallback_lr = 0.00005
rank = 1

[adam_mini]
lr = 0.00005

[trainer]
max_optimizer_steps = 6
logging_steps = 1
eval_every = 3

[output]
directory = "runs"
